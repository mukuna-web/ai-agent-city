[project]
name = "ai-agent-city"
version = "0.1.0"
description = "Local seeded multi-agent economic simulation with explainable aggregate reporting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "duckdb>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
inference = [
    "vllm>=0.6",
    "torch>=2.4",
    "transformers>=4.46",
]
viz = [
    "aiohttp>=3.11",
    "websockets>=13.0",
    "uvicorn>=0.32",
    "fastapi>=0.115",
]

[project.scripts]
agent-city = "main:main"
agent-city-review = "review_report:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents", "engine", "economy", "learning"]
py-modules = ["main", "reporting", "review_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["reporting"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
